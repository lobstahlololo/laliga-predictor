name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Byte-compile sources
        run: python -m compileall -q src dashboard main.py predict_upcoming.py backfill_results.py

      - name: Run test suite
        run: python -m pytest -q

      - name: Verify model registry artifacts
        run: python -m src.models.registry verify
