name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash
    env:
      # The suite must not depend on network access or credentials.
      LALIGA_FIXTURE_DISCOVERY: "0"
      LALIGA_FOOTBALL_API_KEY: ""
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies from requirements (clean environment)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip check

      - name: Byte-compile sources
        run: python -m compileall -q src dashboard tests main.py predict_upcoming.py backfill_results.py

      - name: Run full test suite
        run: python -m pytest

      - name: Verify model registry artifacts
        run: python -m src.models.registry verify

      - name: Data-quality audit
        run: python -m src.data.data_quality

      - name: Fixture coverage audit
        run: python -m src.data.fixture_coverage

      - name: Historical xG/availability source audit
        run: python -m src.data.historical_sources

      - name: Full-season evaluation (no artifact writes)
        if: runner.os == 'Linux'
        run: python -m src.evaluation.full_season --bootstrap 100 --no-save

      - name: Optional Redis backend degrades without a live server
        if: runner.os == 'Linux'
        env:
          LALIGA_CACHE_BACKEND: redis
          LALIGA_REDIS_URL: redis://127.0.0.1:6399/0
        run: |
          python - <<'PY'
          from src.api.cache import build_cache, cached_call

          cache = build_cache("redis")
          assert cached_call(cache, "ci:redis", lambda: {"ok": True}) == {"ok": True}
          print("cache backend after unavailable Redis:", cache.backend)
          PY

      - name: Pipeline smoke without credentials and registry integrity
        if: runner.os == 'Linux'
        run: |
          python -m src.pipeline.automation --steps reports,monitoring --no-notify
          if [ -n "$(git status --porcelain models/registry)" ]; then
            echo "Operational pipeline modified production registry artifacts:"
            git status --porcelain models/registry
            exit 1
          fi
