name: Daily update cycle

on:
  schedule:
    # 06:15 UTC daily. Football-Data results usually land after matchdays.
    - cron: "15 6 * * *"
  workflow_dispatch:

concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Verify production model registry
        run: python -m src.models.registry verify

      - name: Refresh data, reconcile results, reports, monitoring
        env:
          LALIGA_ALERT_WEBHOOK: ${{ secrets.LALIGA_ALERT_WEBHOOK }}
          # Optional: a personal TheSportsDB/API-Football key. The free public
          # key is used when the secret is unset.
          LALIGA_FOOTBALL_API_KEY: ${{ secrets.LALIGA_FOOTBALL_API_KEY }}
          LALIGA_FIXTURE_PROVIDER: thesportsdb
        run: python -m src.pipeline.automation --steps data,predict,backfill,reports,monitoring --retries 2

      - name: Upload operational artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-artifacts
          path: |
            reports/
            logs/
            models/evaluation/
          retention-days: 14
          if-no-files-found: warn
